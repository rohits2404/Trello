<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background -->
    <linearGradient id="background" x1="55" y1="35" x2="455" y2="475">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.42" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Main card -->
    <linearGradient id="cardMain" x1="112" y1="75" x2="245" y2="430">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#D9E5FF"/>
    </linearGradient>

    <!-- Secondary card -->
    <linearGradient id="cardSecondary" x1="275" y1="85" x2="410" y2="420">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#C9D9FF"/>
    </linearGradient>

    <!-- Blue side -->
    <linearGradient id="sideBlue" x1="200" y1="180" x2="350" y2="400">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.45" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Purple side -->
    <linearGradient id="sidePurple" x1="300" y1="180" x2="425" y2="400">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>

    <!-- Glass reflection -->
    <linearGradient id="glass" x1="100" y1="70" x2="390" y2="440">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow
        dx="0"
        dy="28"
        stdDeviation="25"
        flood-color="#11145C"
        flood-opacity="0.38"
      />
    </filter>

    <!-- Glow -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="smallBlur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ========================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================= -->

  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#background)"
  />

  <!-- Ambient light -->
  <ellipse
    cx="255"
    cy="130"
    rx="190"
    ry="130"
    fill="url(#purpleGlow)"
    filter="url(#blur)"
  />

  <!-- Bottom ambient shadow -->
  <ellipse
    cx="256"
    cy="438"
    rx="155"
    ry="30"
    fill="#111452"
    opacity="0.4"
    filter="url(#smallBlur)"
  />

  <!-- ========================================= -->
  <!-- 3D FLOWDECK MARK -->
  <!-- ========================================= -->

  <g filter="url(#shadow)">
    <path
      d="
        M92 116
        C92 94 109 77 131 77
        H191
        C213 77 230 94 230 116
        V342
        C230 364 213 381 191 381
        H131
        C109 381 92 364 92 342
        Z
      "
      fill="url(#sideBlue)"
    />

    <!-- Main vertical -->
    <rect
      x="76"
      y="64"
      width="138"
      height="352"
      rx="46"
      fill="url(#cardMain)"
    />

    <!-- Vertical glass -->
    <path
      d="
        M122 78
        H170
        C190 78 201 91 201 111
        V369
        C201 389 190 402 170 402
        H139
        C119 402 108 389 108 369
        V111
        C108 91 112 78 122 78
        Z
      "
      fill="url(#glass)"
      opacity="0.65"
    />

    <!-- Vertical inner edge -->
    <rect
      x="91"
      y="79"
      width="108"
      height="322"
      rx="34"
      stroke="#B8C9F3"
      stroke-width="3"
      opacity="0.45"
    />

    <!-- Vertical highlight -->
    <path
      d="M108 112C108 94 120 81 138 81"
      stroke="white"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.82"
    />
    <path
      d="
        M177 123
        H371
        C394 123 412 141 412 164
        V204
        C412 227 394 245 371 245
        H177
        Z
      "
      fill="url(#sidePurple)"
    />

    <!-- Main horizontal -->
    <path
      d="
        M177 92
        H371
        C394 92 412 110 412 133
        V173
        C412 196 394 214 371 214
        H177
        C155 214 137 196 137 173
        V133
        C137 110 155 92 177 92
        Z
      "
      fill="url(#cardSecondary)"
    />

    <!-- Horizontal glass -->
    <path
      d="
        M179 106
        H368
        C383 106 396 118 396 134
        V153
        H176
        C163 153 153 164 153 177
        V132
        C153 117 164 106 179 106
        Z
      "
      fill="url(#glass)"
      opacity="0.68"
    />

    <!-- Horizontal inner bevel -->
    <path
      d="
        M178 106
        H369
        C385 106 397 118 397 134
        V172
        C397 188 385 200 369 200
        H178
      "
      stroke="#B7C8F1"
      stroke-width="3"
      opacity="0.45"
    />

    <!-- Horizontal highlight -->
    <path
      d="M177 108H365C383 108 395 119 395 135"
      stroke="white"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.82"
    />

    <!-- Lower flowing card -->
    <path
      d="
        M177 238
        H319
        C341 238 359 256 359 278
        V318
        C359 340 341 358 319 358
        H177
        C155 358 137 340 137 318
        V278
        C137 256 155 238 177 238
        Z
      "
      fill="url(#cardSecondary)"
    />

    <!-- Lower extrusion -->
    <path
      d="
        M177 269
        H319
        C341 269 359 287 359 309
        V349
        C359 371 341 389 319 389
        H177
        C155 389 137 371 137 349
        V309
        C137 287 155 269 177 269
        Z
      "
      fill="url(#sidePurple)"
      opacity="0.88"
    />

    <!-- Lower glass -->
    <path
      d="
        M177 251
        H318
        C333 251 345 263 345 278
        V298
        H174
        C161 298 151 308 151 321
        V277
        C151 263 162 251 177 251
        Z
      "
      fill="url(#glass)"
      opacity="0.62"
    />

    <!-- Lower bevel -->
    <path
      d="
        M177 251
        H319
        C334 251 346 263 346 278
        V318
        C346 333 334 345 319 345
        H177
      "
      stroke="#B7C8F1"
      stroke-width="3"
      opacity="0.42"
    />

    <!-- Lower highlight -->
    <path
      d="M177 253H316C332 253 343 264 343 279"
      stroke="white"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.76"
    />

  </g>

  <!-- ========================================= -->
  <!-- FLOATING BRAND ACCENTS -->
  <!-- ========================================= -->

  <!-- Top shine -->
  <circle
    cx="398"
    cy="78"
    r="7"
    fill="#DDD6FE"
    opacity="0.9"
  />

  <circle
    cx="398"
    cy="78"
    r="3"
    fill="white"
  />

  <!-- Small floating dot -->
  <circle
    cx="438"
    cy="121"
    r="5"
    fill="#C4B5FD"
    opacity="0.8"
  />

  <!-- Tiny blue dot -->
  <circle
    cx="68"
    cy="394"
    r="4"
    fill="#93C5FD"
    opacity="0.7"
  />

  <!-- Subtle diagonal shine -->
  <path
    d="M76 154C76 105 112 64 159 64"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.22"
  />
</svg>